[workspace]
resolver = "2"
members = [
    "crates/arks-config",
    "crates/arks-net",
    "crates/arks-hash",
    "crates/arks-oid",
    "crates/arks-object",
    "crates/arks-store",
    "crates/arks-refs",
    "crates/arks-index",
    "crates/arks-repo",
    "crates/arks-protocol",
    "crates/arks-pack",
    "crates/arks-remote",
    "crates/arks-lease",
    "crates/arks-server",
    "crates/arks-hub",
    "crates/arks-agent",
    "crates/arks",
    # arks-hostfs kept in-tree as non-default (trimmed from product surface).
    "crates/arks-hostfs",
]
default-members = [
    "crates/arks-config",
    "crates/arks-net",
    "crates/arks-hash",
    "crates/arks-oid",
    "crates/arks-object",
    "crates/arks-store",
    "crates/arks-refs",
    "crates/arks-index",
    "crates/arks-repo",
    "crates/arks-protocol",
    "crates/arks-pack",
    "crates/arks-remote",
    "crates/arks-lease",
    "crates/arks-server",
    "crates/arks-hub",
    "crates/arks-agent",
    "crates/arks",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"
version = "0.2.0"
repository = "https://github.com/modootoday/arks"
homepage = "https://modootoday.github.io/arks/"
readme = "README.md"
keywords = ["git", "vcs", "cli", "concurrency"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
arks-config = { version = "0.2.0", path = "crates/arks-config" }
arks-net = { version = "0.2.0", path = "crates/arks-net" }
arks-hash = { version = "0.2.0", path = "crates/arks-hash" }
arks-oid = { version = "0.2.0", path = "crates/arks-oid" }
arks-object = { version = "0.2.0", path = "crates/arks-object" }
arks-store = { version = "0.2.0", path = "crates/arks-store" }
arks-refs = { version = "0.2.0", path = "crates/arks-refs" }
arks-index = { version = "0.2.0", path = "crates/arks-index" }
arks-repo = { version = "0.2.0", path = "crates/arks-repo" }
arks-protocol = { version = "0.2.0", path = "crates/arks-protocol" }
arks-pack = { version = "0.2.0", path = "crates/arks-pack" }
arks-remote = { version = "0.2.0", path = "crates/arks-remote" }
arks-lease = { version = "0.2.0", path = "crates/arks-lease" }
arks-server = { version = "0.2.0", path = "crates/arks-server" }
arks-hub = { version = "0.2.0", path = "crates/arks-hub" }
arks-agent = { version = "0.2.0", path = "crates/arks-agent" }
arks-hostfs = { version = "0.2.0", path = "crates/arks-hostfs" }
arks = { version = "0.2.0", path = "crates/arks" }
crc32fast = "1.4"
libc = "0.2"
# zlib-rs: faster pack inflate than miniz on the smart-HTTP clone hot path
# (J-CLONE-LOCAL); keep default-features off (no C zlib).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
sha1 = { version = "0.10", default-features = false, features = ["asm"] }
# OBJ-004 detect+refuse (Claimed); cryptographic immunity remains Impossible.
sha1collisiondetection = { version = "0.3.4", default-features = false, features = ["digest-trait"] }
sha2 = { version = "0.10", default-features = false }
# SSH serve Partial KEX (curve25519 ECDH) + optional ed25519 host-key sign Partial;
# not a Claimed SSH stack / russh substitute.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# OpenSSH's chacha20-poly1305@openssh.com transport uses two legacy-nonce
# ChaCha20 keys plus a per-packet Poly1305 key (PROTOCOL.chacha20).
chacha20 = { version = "0.9", default-features = false }
poly1305 = { version = "0.8", default-features = false }
subtle = { version = "2.6", default-features = false }
base64 = "0.22"
# Pure-Rust NaCl/libsodium crypto_box_seal (X25519 + BLAKE2b-192 + XSalsa20Poly1305) for Actions secrets (E2).
crypto_box = { version = "0.9", features = ["seal"] }
thiserror = "2.0"
windows = { version = "0.58", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
tempfile = "3"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# Hub local HTTPS smoke Partial (self-signed); not Claimed in-process TLS product.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
# Same root set ureq 2 ships; extended with operator CA (cloud-agent-dropin §T).
webpki-roots = "0.26"

[profile.dev]
# Keep host advisory builds light when many agents share the machine.
incremental = true

[profile.release]
# M17 / G19: tighten release codegen for clean-room comparative timings.
# thin LTO: fat LTO + codegen-units=1 SIGKILL (137) under Docker Desktop peak RSS.
lto = "thin"
codegen-units = 8
opt-level = 3
strip = true
panic = "abort"
