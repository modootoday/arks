# arks authoritative clean-room gates (G0–G7, G10–G15) + additive G16–G41 (journey/issue/CELIR/PR-sim/live-private + M25 transports + G33 cred + G34 shared-index + G35 shallow + G36 Basic + G37 gpgsig SSH + G38 OpenPGP/X.509/tag-s + G39 blob:none + G40 dumb deletes + G41 Apache DAV).
# Engine: Linux (Docker Desktop desktop-linux on Windows). Fresh `compose run` per gate.
name: arks-verify-m1

x-cleanroom: &cleanroom
  image: arks-verify-m1:0.1.0
  working_dir: /workspace
  volumes:
    - ..:/workspace:rw
    # Optional celir-* path-deps in arks-store resolve ../../../discrete-circuit → /discrete-circuit
    # (feature stays OFF for G0–G21; parse-time only). G22+ use /workspaces/* layout separately.
    - ../../discrete-circuit:/discrete-circuit:ro
    # Linux-local target dir: fat LTO on a Windows bind mount OOMs/SIGKILLs (137).
    - arks-cargo-target:/cargo-target
  environment:
    CARGO_BUILD_JOBS: "1"
    CARGO_TARGET_DIR: /cargo-target
    RUSTUP_TOOLCHAIN: "1.99.1"

volumes:
  arks-cargo-target:
  arks-cargo-target-g033:
  g041-git-data:

services:
  # Build once; g000-workspace-lib-tests–g007-smart-http-client/g010-store-facade–g018-concurrency-issue-compare reuse the same tagged image.
  toolchain:
    <<: *cleanroom
    build:
      context: ..
      dockerfile: verify/Dockerfile
    command: ["true"]

  g000-workspace-lib-tests:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g000-workspace-lib-tests.sh"]

  g001-loose-object-interop:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g001-loose-object-interop.sh"]

  g002-refs-index-roundtrip:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g002-refs-index-roundtrip.sh"]

  g003-index-commit-roundtrip:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g003-index-commit-roundtrip.sh"]

  g004-pack-idx-roundtrip:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g004-pack-idx-roundtrip.sh"]

  g005-protocol-offline-fixtures:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g005-protocol-offline-fixtures.sh"]

  g006-cli-wave-l:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g006-cli-wave-l.sh"]

  g007-smart-http-client:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g007-smart-http-client.sh"]

  # G8 live forge smoke — default-on when token+URL present; SKIP when absent (ADR 20261110220000).
  g008-live-forge-smoke:
    <<: *cleanroom
    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G8_LIVE: "${ARKS_G8_LIVE:-}"
      ARKS_G8_TOKEN: "${ARKS_G8_TOKEN:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      ARKS_G8_REPO_URL: "${ARKS_G8_REPO_URL:-}"
    command: ["/bin/bash", "verify/scripts/run-g008-live-forge-smoke.sh"]

  # G8+ live forge scale — measure when secrets present; SKIP no-measurement when absent (ADR 20261110221000).
  g008-live-scale:
    <<: *cleanroom
    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G8_LIVE: "${ARKS_G8_LIVE:-}"
      ARKS_G8_TOKEN: "${ARKS_G8_TOKEN:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      ARKS_G8_REPO_URL: "${ARKS_G8_REPO_URL:-}"
      ARKS_G8_SCALE_MEASURE: "${ARKS_G8_SCALE_MEASURE:-}"
      ARKS_G8_SCALE_SAMPLES: "${ARKS_G8_SCALE_SAMPLES:-5}"
    command: ["/bin/bash", "verify/scripts/run-g008-live-scale.sh"]

  # FS-007 / WIN-003 host advisory — detect-only; ≠ Claimed full cloud-sync.
  fs007-host-advisory:
    <<: *cleanroom
    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_FS007_PROBE_ROOT: "${ARKS_FS007_PROBE_ROOT:-.}"
    command: ["/bin/bash", "verify/scripts/run-fs007-host-advisory.sh"]

  # FS-014 LSM detect + errno honesty — advisory; ≠ Claimed host-policy bypass.
  fs014-lsm-advisory:
    <<: *cleanroom
    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_FS014_PROBE_ROOT: "${ARKS_FS014_PROBE_ROOT:-.}"
    command: ["/bin/bash", "verify/scripts/run-fs014-lsm-advisory.sh"]

  # G8 local-forge wire substitute — loopback smart-HTTP peer; ≠ GitHub live PASS.
  g008-local-forge:
    <<: *cleanroom
    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G8_LOCAL_FORGE_SAMPLES: "${ARKS_G8_LOCAL_FORGE_SAMPLES:-3}"
    command: ["/bin/bash", "verify/scripts/run-g008-local-forge.sh"]

  g010-store-facade:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g010-store-facade.sh"]

  g012-porcelain-wave-pa:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g012-porcelain-wave-pa.sh"]

  g013-porcelain-wave-pb:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g013-porcelain-wave-pb.sh"]

  g014-cli-parity-production:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g014-cli-parity-production.sh"]

  g011-lease-product:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g011-lease-product.sh"]

  # M23 L3 HighConcurrency claimed-shape stress (G11 expansion).
  # Legacy alias: g11l3 / run-g11l3.sh (pre-Migration Appendix A).
  g011-high-concurrency:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g011-high-concurrency.sh"]

  g015-smart-http:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g015-smart-http.sh"]

  # Additive journey-compare (func + timing). Not a production unlock.
  g016-journey-compare:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g016-journey-compare.sh"]

  # M12 Cm concurrency issue-repro compare (git pathology vs arks resolved).
  g017-concurrency-issue-compare:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g017-concurrency-issue-compare.sh"]

  # M13 Cd concurrency issue-repro compare differentiate/lease (git pathology vs arks resolved).
  g018-concurrency-issue-compare:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g018-concurrency-issue-compare.sh"]

  # M14 Pf comparative ≥20% (arks_median ≤ 0.8× git_median) on G19 allow-list.
  g019-comparative-performance:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g019-comparative-performance.sh"]

  # M15 Fs full CLI symmetric parity (G20).
  g020-cli-symmetric-parity:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g020-cli-symmetric-parity.sh"]

  # M16 Sy complete CLI flag symmetry (G21).
  g021-cli-flag-symmetry:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g021-cli-flag-symmetry.sh"]

  # M24 G22 CELIR index contention (requires discrete-circuit sibling mount).
  g022-celir-index-contention:
    image: arks-verify-m1:0.1.0
    working_dir: /workspaces/gir
    depends_on:
      - toolchain
    volumes:
      - ..:/workspaces/gir:rw
      # Path-deps from crates/arks-store resolve ../../../discrete-circuit → /workspaces/discrete-circuit
      - ../../discrete-circuit:/workspaces/discrete-circuit:ro
      - arks-cargo-target:/cargo-target
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G22_ROOT: /workspaces/gir
    command: ["/bin/bash", "verify/scripts/run-g022-celir-index-contention.sh"]

  # M24 successor G23 — CELIR dual-path Git verified (FS sole ObjectStore + index sidecar).
  g023-celir-dual-path:
    image: arks-verify-m1:0.1.0
    working_dir: /workspaces/gir
    depends_on:
      - toolchain
    volumes:
      - ..:/workspaces/gir:rw
      - ../../discrete-circuit:/workspaces/discrete-circuit:ro
      - arks-cargo-target:/cargo-target
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G23_ROOT: /workspaces/gir
    command: ["/bin/bash", "verify/scripts/run-g023-celir-dual-path.sh"]

  # M24 successor G24 — L3 HighConcurrency + CELIR index joint.
  g024-l3-celir-joint:
    image: arks-verify-m1:0.1.0
    working_dir: /workspaces/gir
    depends_on:
      - toolchain
    volumes:
      - ..:/workspaces/gir:rw
      - ../../discrete-circuit:/workspaces/discrete-circuit:ro
      - arks-cargo-target:/cargo-target
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G24_ROOT: /workspaces/gir
    command: ["/bin/bash", "verify/scripts/run-g024-l3-celir-joint.sh"]

  # M24 successor G25 — CELIR index scale (N=256 required; 384/512 stretch).
  g025-celir-index-scale:
    image: arks-verify-m1:0.1.0
    working_dir: /workspaces/gir
    depends_on:
      - toolchain
    volumes:
      - ..:/workspaces/gir:rw
      - ../../discrete-circuit:/workspaces/discrete-circuit:ro
      - arks-cargo-target:/cargo-target
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G25_ROOT: /workspaces/gir
      ARKS_G25_STRETCH: "1"
    command: ["/bin/bash", "verify/scripts/run-g025-celir-index-scale.sh"]

  # G26 — local branch + synthetic PR-env scale (stream B; no CELIR feature; sole-runner).
  # Mount discrete-circuit so Cargo can parse arks-store optional path-deps (feature stays OFF).
  g026-local-branch-pr-sim:
    image: arks-verify-m1:0.1.0
    working_dir: /workspaces/gir
    depends_on:
      - toolchain
    volumes:
      - ..:/workspaces/gir:rw
      - ../../discrete-circuit:/workspaces/discrete-circuit:ro
      - arks-cargo-target:/cargo-target
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G26_ROOT: /workspaces/gir
    command: ["/bin/bash", "verify/scripts/run-g026-local-branch-pr-sim.sh"]

  # G27 — arks smart HTTP as GitHub stand-in: thousands-class seed + N concurrent agents.
  # Honesty: ≠ GitHub UX/Checks/merge-queue; ≠ live forge throughput. Sole-runner vs heavy gates.
  g027-smart-http-pr-contention:
    image: arks-verify-m1:0.1.0
    working_dir: /workspaces/gir
    depends_on:
      - toolchain
    volumes:
      - ..:/workspaces/gir:rw
      - ../../discrete-circuit:/workspaces/discrete-circuit:ro
      - arks-cargo-target:/cargo-target
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G27_ROOT: /workspaces/gir
      ARKS_G27_N_BRANCHES: "2048"
      ARKS_G27_N_PR: "2048"
      ARKS_G27_N_AGENTS: "8"
    command: ["/bin/bash", "verify/scripts/run-g027-smart-http-pr-contention.sh"]

  # G28 — live private GitHub normal-user journeys with arks (G16 checklist).
  # Opt-in network + secrets; default Refuse-closed. ≠ scale/contention; ≠ G16 timing.
  # Mount discrete-circuit for celir-data path-dep (same as G22–G27); network left default (live forge).
  g028-live-private-arks:
    image: arks-verify-m1:0.1.0
    working_dir: /workspaces/gir
    depends_on:
      - toolchain
    volumes:
      - ..:/workspaces/gir:rw
      - ../../discrete-circuit:/workspaces/discrete-circuit:ro
      - arks-cargo-target:/cargo-target
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G28_LIVE: "${ARKS_G28_LIVE:-0}"
      ARKS_G28_TOKEN: "${ARKS_G28_TOKEN:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      ARKS_G28_REPO_URL: "${ARKS_G28_REPO_URL:-}"
      ARKS_G28_REPO_URL_PUBLIC: "${ARKS_G28_REPO_URL_PUBLIC:-}"
      ARKS_G28_SUBMODULE_URL: "${ARKS_G28_SUBMODULE_URL:-}"
    command: ["/bin/bash", "verify/scripts/run-g028-live-private-arks.sh"]

  # G28 offline clone closure — J-CLONE-LOCAL-01 + J-CLONE-PATH-01 (G16-aligned; no live forge).
  # Same mount layout as g028-live-private-arks so optional celir-data path-deps resolve under /workspaces.
  g028-offline-clones:
    image: arks-verify-m1:0.1.0
    working_dir: /workspaces/gir
    depends_on:
      - toolchain
    volumes:
      - ..:/workspaces/gir:rw
      - ../../discrete-circuit:/workspaces/discrete-circuit:ro
      - arks-cargo-target:/cargo-target
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G28_ROOT: /workspaces/gir
    command: ["/bin/bash", "verify/scripts/run-g028-offline-clones.sh"]

  # M25 server transport expansion (sole-runner; serialize with sibling Docker agents).
  g029-server-dumb-http:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g029-server-dumb-http.sh"]

  g030-server-ssh-command:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g030-server-ssh-command.sh"]

  g031-server-protocol-v2:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g031-server-protocol-v2.sh"]

  g032-git-daemon-wire:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g032-git-daemon-wire.sh"]

  # FW-SHARED-IDX / M26 shared-index N-way
  g034-shared-index-contention:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g034-shared-index-contention.sh"]

  # FW-G9 shallow --depth subset
  g035-shallow-depth:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g035-shallow-depth.sh"]

  # FW-CRED-ASKPASS — client credential-helper / askpass (sole-runner).
  g033-cred-askpass:
    <<: *cleanroom
    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target-g033-cred-askpass
      RUSTUP_TOOLCHAIN: "1.99.1"
    volumes:
      - ..:/workspace:rw
      - ../../discrete-circuit:/discrete-circuit:ro
      - arks-cargo-target-g033:/cargo-target-g033-cred-askpass
    command: ["/bin/bash", "verify/scripts/run-g033-cred-askpass.sh"]

  # FW-AUTH-PROXY optional HTTP Basic.
  g036-http-basic-auth:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g036-http-basic-auth.sh"]

  g037-gpgsig-ssh:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g037-gpgsig-ssh.sh"]

  # FW-GPGSIG OpenPGP / X.509 / tag -s (R4 / S2).
  g038-gpgsig-openpgp:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g038-gpgsig-openpgp.sh"]

  # R3 blob:none clean-room twin (S6).
  g039-partial-clone-filter:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g039-partial-clone-filter.sh"]

  # S3 dumb HTTP push deletes clean-room twin (S6).
  g040-dumb-http-push-deletes:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-g040-dumb-http-push-deletes.sh"]

  # O4 Apache mod_dav dumb HTTP interop — seed bare repo, then stock httpd DAV.
  g041-seed:
    <<: *cleanroom
    depends_on:
      - toolchain
    volumes:
      - ..:/workspace:rw
      - ../../discrete-circuit:/discrete-circuit:ro
      - arks-cargo-target:/cargo-target
      - g041-git-data:/git-data
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G41_DOCROOT: /git-data
    command: ["/bin/bash", "verify/gates/g041-apache-dav-interop/seed.sh"]

  g041-dav:
    image: httpd:2.4-bookworm
    depends_on:
      g041-seed:
        condition: service_completed_successfully
    volumes:
      - g041-git-data:/usr/local/apache2/htdocs
      - ./gates/g041-apache-dav-interop/httpd/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    # Ensure DavLockDB parent exists before httpd starts.
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mkdir -p /usr/local/apache2/var && chown daemon:daemon /usr/local/apache2/var /usr/local/apache2/htdocs/repo.git 2>/dev/null; exec httpd-foreground",
      ]

  g041-apache-dav-interop:
    <<: *cleanroom
    depends_on:
      toolchain:
        condition: service_started
      g041-dav:
        condition: service_started
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_G41_DAV_URL: http://g041-dav/repo.git/
    command: ["/bin/bash", "verify/scripts/run-g041-apache-dav-interop.sh"]

  # Clean-room DoD pillars (umbrella SoT: verify-cleanroom-symmetry-matrix).
  # Default = smoke honesty; Claimed needs ARKS_DOD_STRICT=1 + evidence (no invent PASS).
  # Usage: docker compose -f verify/docker-compose.yml run --rm dod-cli-matrix

  # Ladder suites (SoT 0.6.0): orchestrate G-gates; not product Claimed by themselves.
  l008-product-completion-e2e:
