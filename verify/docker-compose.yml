    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
    command: ["/bin/bash", "verify/scripts/run-s006-symmetry-e2e.sh"]

  dod-cli-matrix:
    <<: *cleanroom
    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_DOD_STRICT: "${ARKS_DOD_STRICT:-0}"
      # IW-PERSONALITY drop-in sample — sot:root/arks-verify-docker-e2e-claim-wave
      ARKS_PERSONALITY_DROPIN: "${ARKS_PERSONALITY_DROPIN:-0}"
    command: ["/bin/bash", "verify/scripts/run-cli-git-arks-matrix-e2e.sh"]

  dod-daemon-matrix:
    <<: *cleanroom
    depends_on:
      - toolchain
    command: ["/bin/bash", "verify/scripts/run-daemon-git-arks-matrix-e2e.sh"]

  dod-hub-matrix:
    <<: *cleanroom
    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_DOD_STRICT: "${ARKS_DOD_STRICT:-0}"
      # IW-HUB-FLAT Claimed subset STRICT — sot:root/arks-verify-docker-e2e-claim-wave
      ARKS_HUB_IW_FLAT: "${ARKS_HUB_IW_FLAT:-0}"
    command: ["/bin/bash", "verify/scripts/run-hub-gh-arks-matrix-e2e.sh"]

  # Umbrella: all three DoD pillars (sot:root/verify-cleanroom-symmetry-matrix).
  dod-symmetry:
    <<: *cleanroom
    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
      ARKS_DOD_STRICT: "${ARKS_DOD_STRICT:-0}"
    command: ["/bin/bash", "verify/scripts/run-symmetry-dod.sh"]

  # Pre-release pin gate (sot:root/release-symmetry-precheck). Blocks release on
  # Missing>0 / untracked pin leaves; Partial + hub v1 Missing advisory by default.
  dod-symmetry-prerelease:
    <<: *cleanroom
    depends_on:
      - toolchain
    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
