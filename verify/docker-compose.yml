    environment:
      CARGO_BUILD_JOBS: "1"
      CARGO_TARGET_DIR: /cargo-target
      RUSTUP_TOOLCHAIN: "1.99.1"
    command: ["/bin/bash", "verify/scripts/run-l008-product-completion-e2e.sh"]

  s006-symmetry-e2e:
