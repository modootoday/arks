[package]
name = "arks-server"
description = "Git server: upload-pack / receive-pack + smart/dumb HTTP + daemon (M11/M25)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
arks-config = { workspace = true }
arks-protocol = { workspace = true }
arks-pack = { workspace = true }
arks-oid = { workspace = true }
arks-object = { workspace = true }
arks-store = { workspace = true }
arks-refs = { workspace = true }
arks-repo = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
chacha20 = { workspace = true }
poly1305 = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }
# Product in-process TLS terminate (B9); operator-supplied PEM — not ops reverse-proxy alone.
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
# Test-only certificate generation (no PEM fixtures in tracked paths).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
