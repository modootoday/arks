[package]
name = "arks"
description = "arks for Git — native Rust Git-compatible CLI, daemon, forge client and self-host server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "arks"
path = "src/main.rs"

[dependencies]
arks-config = { workspace = true }
arks-hash = { workspace = true }
arks-oid = { workspace = true }
arks-object = { workspace = true }
arks-store = { workspace = true }
arks-refs = { workspace = true }
arks-index = { workspace = true }
arks-repo = { workspace = true }
arks-remote = { workspace = true }
arks-server = { workspace = true }
arks-hub = { workspace = true }
arks-agent = { workspace = true }
arks-pack = { workspace = true }
arks-lease = { workspace = true }
thiserror = { workspace = true }
serde_json = "1"
rustls = { workspace = true }
webpki-roots = { workspace = true }
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Test CA + leaf for the `arks agent` HTTPS smoke tests (same pin as arks-server;
# no PEM fixtures in tracked paths).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
