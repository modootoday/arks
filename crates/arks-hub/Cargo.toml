[package]
name = "arks-hub"
description = "Forge collaboration surface for arks (library; entered via `arks hub` / flat forge leaves)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { workspace = true }
arks-net = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
# Key fingerprints for forge key records (OpenSSH SHA-256; OpenPGP v4 SHA-1 / v6 SHA-256).
base64 = { workspace = true }
sha1collisiondetection = { workspace = true }
sha2 = { workspace = true }
# Forge repository content (contents API, search, pull-request diff/merge): in-process
# Git object and ref access; never spawns git.
arks-oid = { workspace = true }
arks-object = { workspace = true }
arks-refs = { workspace = true }
arks-repo = { workspace = true }
arks-store = { workspace = true }
# Source archives for `release download --archive` (tar.gz / zip).
flate2 = { workspace = true }
crc32fast = { workspace = true }
