[package]
name = "arks-hub"
description = "Forge collaboration surface for arks (library; entered via `arks hub` / flat forge leaves)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { workspace = true }
arks-net = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
# In-process Git for `repo clone|sync|read-*`, `issue develop` (never spawn git).
arks-remote = { workspace = true }
arks-repo = { workspace = true }
arks-refs = { workspace = true }
arks-oid = { workspace = true }
arks-object = { workspace = true }
arks-index = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
