# Tag-triggered release for arks (Rust CLI) + workflow_dispatch dry-run.
#
# Live: v* tag → ungated dist → draft GitHub Release (checksum/unsigned)
#       → per-channel OIDC publish jobs, each gated by its GitHub Environment.
# Dry-run: workflow_dispatch → dist + readiness report only (no Release/publish).
#
# Environments (live on modootoday/arks; required reviewer myso-kr; tag policy v*):
#   crates | npm | pypi | rubygems
# YAML alone cannot invent reviewers — humans configure protection in
# https://github.com/modootoday/arks/settings/environments
#
# OUT / Deferred (do not add jobs): winget, apt signed repo, Chocolatey,
# Authenticode, Apple Developer ID + notarization.
#
# Runner pins (2026-11-10) — see research § Runner-image Annotations:
#   ubuntu-24.04, windows-2025, macos-15
# (avoid ubuntu-22.04 brownouts; avoid macos-14 retired; pin away from *-latest
# during ubuntu-latest → 26.04 migration window).
#
# Action pins: actions/checkout@v5+ (Node 24) clears Node 20 deprecation
# Annotations. Artifact actions use Node-24 majors (upload-artifact@v4→@v5+).
#
# Fail-closed: no long-lived registry tokens in repo secrets. OIDC only
# (permissions.id-token: write). Skip publish when crate/wrapper packaging
# is not ready or trusted publisher is not configured — never fall back to
# plaintext tokens.

name: release

on:
  push:
    tags: ["v*"]
  # Dry-run readiness: dist + structural report only. Never publishes from
  # workflow_dispatch alone (Environments require tag policy v*).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dist + readiness only (no draft Release, no OIDC publish)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Hard gate: pin DoD + latest git/gh inventory continuity ---
  # Cite: .spec/sot/release-symmetry-precheck.sot.md
  # Fails closed on Missing (CLI/daemon/hub v1) and untracked leaves; Partial
  # rows remain advisory (no invent Claimed).
  symmetry-precheck:
    name: release symmetry precheck
    uses: ./.github/workflows/release-symmetry.yml
    with:
      block_hub_missing: true

  # --- Ungated only after symmetry-precheck: build release binaries + checksums ---
  dist:
    name: dist (${{ matrix.target }})
    needs: [symmetry-precheck]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --locked --release -p arks --target ${{ matrix.target }}

      - name: Package + SHA256
        shell: bash
        run: |
          set -euo pipefail
          name="arks-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe";; esac
          cp "target/${{ matrix.target }}/release/arks${ext}" "dist/$name/"
          cp README.md LICENSE LICENSE-APACHE LICENSE-MIT "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *windows*)
              7z a -tzip "$name.zip" "$name" >/dev/null
              archive="$name.zip"
              ;;
            *)
              tar -czf "$name.tar.gz" "$name"
              archive="$name.tar.gz"
              ;;
          esac
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          mkdir -p ../artifacts
          mv "$archive" "$archive.sha256" ../artifacts/

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  # --- Dry-run only: readiness report (no Release, no OIDC, no Environment) ---
  dry-run-report:
    name: release-channel dry-run report
    if: github.event_name == 'workflow_dispatch'
    needs: dist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Checksums + readiness (not a publish PASS)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Dry-run artifacts"
            echo
            echo "workflow_dispatch dry-run does **not** create a GitHub Release"
            echo "and does **not** claim crates.io / npm / PyPI / RubyGems publish PASS."
            echo
            cd artifacts
            ls -la
            echo
            echo "### SHA256"
            if command -v sha256sum >/dev/null; then
              sha256sum *
            else
              shasum -a 256 *
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cd "$GITHUB_WORKSPACE"
          bash scripts/release-channel-readiness.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Smoke-test PyPI, npm, and RubyGems packaging (dry-run only)
        shell: bash
        run: |
          set -euo pipefail
          SMOKE="$(mktemp -d)"
          trap 'rm -rf "$SMOKE"' EXIT

          echo "### Multi-registry packaging dry-run smoke" >> "$GITHUB_STEP_SUMMARY"

          # 1. PyPI binary wheels
          python3 packaging/pypi/build_wheels.py \
            --artifacts-dir artifacts \
            --out-dir "$SMOKE/wheels"
          python3 -m venv "$SMOKE/venv"
          "$SMOKE/venv/bin/pip" install --quiet --no-index --find-links "$SMOKE/wheels" arks-cli
          PY_VER="$("$SMOKE/venv/bin/arks" --version)"
          echo "- PyPI wheels (3 platforms): OK (\`${PY_VER}\`)" | tee -a "$GITHUB_STEP_SUMMARY"

          # 2. npm platform packages + root shim (@modootoday/*)
          node packaging/npm/build_packages.mjs \
            --artifacts-dir artifacts \
            --out-dir "$SMOKE/npm"
          mkdir -p "$SMOKE/npm-tgz" "$SMOKE/npm-app"
          for p in arks-linux-x64 arks-darwin-arm64 arks-win32-x64 arks; do
            (cd "$SMOKE/npm/$p" && npm pack --quiet --pack-destination "$SMOKE/npm-tgz")
          done
          (cd "$SMOKE/npm-app" && npm init -y >/dev/null && \
            npm install --no-audit --no-fund --offline \
              "$SMOKE/npm-tgz"/modootoday-arks-linux-x64-*.tgz \
              "$SMOKE/npm-tgz"/modootoday-arks-[0-9]*.tgz >/dev/null)
          NPM_VER="$("$SMOKE/npm-app/node_modules/.bin/arks" --version)"
          echo "- npm packages (@modootoday/*, 3 platforms + root): OK (\`${NPM_VER}\`)" | tee -a "$GITHUB_STEP_SUMMARY"

          # 3. RubyGems platform gems
          ruby packaging/rubygems/build_gems.rb \
            --artifacts-dir artifacts \
            --out-dir "$SMOKE/gems"
          GEM_HOME="$SMOKE/gem-home" GEM_PATH="$SMOKE/gem-home" \
            gem install --local --no-document "$SMOKE/gems"/arks-*-x86_64-linux.gem
          GEM_VER="$(GEM_HOME="$SMOKE/gem-home" GEM_PATH="$SMOKE/gem-home" \
            "$SMOKE/gem-home/bin/arks" --version)"
          echo "- RubyGems gems (3 platforms): OK (\`${GEM_VER}\`)" | tee -a "$GITHUB_STEP_SUMMARY"

  # --- Ungated: draft GitHub Release + attach assets (checksum / unsigned) ---
  github-release:
    name: GitHub Release (draft)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Assemble SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -la
          {
            for f in *.sha256; do
              cat "$f"
            done
          } > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

      - name: Create or reuse draft release + upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading missing assets only"
          else
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "arks $TAG — unsigned / checksum-listed GitHub Release assets. Registry publishes are separate approve-gated jobs (environments: crates, npm, pypi, rubygems)."
          fi
          gh release upload "$TAG" artifacts/* --clobber

  # --- Approve-gated OIDC: crates.io ---
  publish-crates:
    name: publish crates.io (OIDC)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-24.04
    # Human approval via Environment protection (required reviewers).
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Skip if workspace crates are not publishable yet
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -qE '^publish\s*=\s*false' crates/arks/Cargo.toml; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "arks has publish=false; skipping crates.io until the crate is publish-ready." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing: exchange OIDC for short-lived token.
      # No CARGO_REGISTRY_TOKEN secret fallback (fail-closed).
      # Human must complete one-time initial manual publish (scripts/bootstrap-crates-publish.sh)
      # and configure trusted publisher on crates.io for each of the 18 workspace crates:
      # repo "modootoday/arks", workflow "release.yml", environment "crates".
      # https://crates.io/docs/trusted-publishing/
      - name: crates.io OIDC auth
        if: steps.gate.outputs.skip != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish (18 workspace crates, topological order)
        if: steps.gate.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          ARKS_CRATES_WAIT_SECS: "20"
        run: bash scripts/bootstrap-crates-publish.sh

  # --- Approve-gated OIDC: npm ---
  publish-npm:
    name: publish npm (OIDC)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Skip if npm packaging tree is absent
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f packaging/npm/build_packages.mjs ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No packaging/npm tree yet; OIDC job + environment npm are wired; skip publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing + provenance on public repos.
      # Requires npm ≥ 11.5.1, Node ≥ 22.14, GitHub-hosted runner.
      # Human must complete one-time manual first publish (scripts/bootstrap-npm-publish.sh)
      # and bind trusted publisher on npmjs.com for all 4 packages (`@modootoday/arks`,
      # `@modootoday/arks-linux-x64`, `@modootoday/arks-darwin-arm64`, `@modootoday/arks-win32-x64`):
      # repo "modootoday/arks", workflow "release.yml", environment "npm".
      # https://docs.npmjs.com/trusted-publishers/
      # No NODE_AUTH_TOKEN / NPM_TOKEN secret fallback, and no setup-node registry-url
      # (which writes an empty _authToken .npmrc line that can interfere with OIDC).
      - name: npm publish (4 packages, OIDC + provenance)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npm --version
          bash scripts/bootstrap-npm-publish.sh --artifacts-dir artifacts --provenance

  # --- Approve-gated OIDC: PyPI ---
  publish-pypi:
    name: publish PyPI (OIDC)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Skip if Python packaging tree is absent
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f packaging/pypi/build_wheels.py ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No packaging/pypi tree yet; OIDC job + environment pypi are wired; skip publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build 3-OS PEP 427/600 binary wheels
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 packaging/pypi/build_wheels.py \
            --artifacts-dir artifacts \
            --out-dir dist-wheels

      # Trusted Publishers: no PYPI_API_TOKEN secret fallback.
      # Human configures Pending/Trusted Publisher on pypi.org for project "arks-cli",
      # repo "modootoday/arks", workflow "release.yml", environment "pypi".
      # https://docs.pypi.org/trusted-publishers/
      - name: Publish to PyPI (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-wheels/

  # --- Approve-gated OIDC: RubyGems ---
  publish-rubygems:
    name: publish RubyGems (OIDC)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: github-release
    runs-on: ubuntu-24.04
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Download dist artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Skip if RubyGems packaging tree is absent
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f packaging/rubygems/build_gems.rb ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No packaging/rubygems tree yet; OIDC job + environment rubygems are wired; skip publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing — no RUBYGEMS_API_KEY secret fallback.
      # Human configures Pending/Trusted Publisher on rubygems.org for gem "arks",
      # repo "modootoday/arks", workflow "release.yml", environment "rubygems".
      # https://guides.rubygems.org/trusted-publishing/
      - uses: ruby/setup-ruby@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Build 3-OS platform gems
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ruby packaging/rubygems/build_gems.rb \
            --artifacts-dir artifacts \
            --out-dir dist-gems

      - name: Configure RubyGems OIDC credentials
        if: steps.gate.outputs.skip != 'true'
        uses: rubygems/configure-rubygems-credentials@v2.2.0

      - name: Push platform gems (OIDC)
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for g in dist-gems/*.gem; do
            gem push "$g"
          done
