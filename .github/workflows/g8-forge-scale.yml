# Secrets-gated live forge scale readiness (product-completion L5 / R5).
#
# Dry-run (default workflow_dispatch): structural readiness + harness SKIP
# paths only — never invents a live forge latency PASS.
#
# Live (dry_run=false): Environment `g8-live`. Harness measures only when
# Environment secrets ARKS_G8_TOKEN (or GITHUB_TOKEN) + ARKS_G8_REPO_URL are
# present; otherwise honest SKIP / no-measurement (exit 0).
#
# Environment lives under:
#   https://github.com/modootoday/arks/settings/environments
# YAML cannot invent secret values. Do not stampede Docker sole-runners /
# G19 remasure from this workflow.
#
# Cite: .spec/adr/20261110220000, .spec/adr/20261110221000,
#       .spec/research/20261110095142-product-completion-goal-ladder.research.md

name: g8-forge-scale

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Readiness + SKIP harness only (no Environment secrets; not a live PASS)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: g8-forge-scale-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  dry-run-report:
    name: forge-scale dry-run report
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Structural readiness (not a live PASS)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Forge-scale dry-run"
            echo
            echo "workflow_dispatch dry-run does **not** call a live forge"
            echo "and does **not** claim G8 remasure or scale latency PASS."
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/forge-scale-readiness.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Harness SKIP paths (no secrets injected)
        shell: bash
        env:
          # Explicitly empty — dry-run must not inherit a measurement PASS.
          ARKS_G8_TOKEN: ""
          ARKS_G8_REPO_URL: ""
          GITHUB_TOKEN: ""
          ARKS_G8_SCALE_OUT: ${{ github.workspace }}/verify/gates/g8-live-scale/out
          ARKS_G8_RECEIPT_OUT: ${{ github.workspace }}/verify/gates/g8/out/receipt.json
        run: |
          set -euo pipefail
          mkdir -p verify/gates/g8/out verify/gates/g8-live-scale/out
          bash verify/scripts/run-g8.sh
          bash verify/scripts/run-g8-live-scale.sh
          {
            echo
            echo "### SKIP receipts (expected without secrets)"
            echo
            echo '```json'
            cat verify/gates/g8/out/receipt.json
            echo '```'
            echo
            echo '```json'
            cat verify/gates/g8-live-scale/out/receipt.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  live-measure:
    name: forge-scale live (Environment g8-live)
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    environment: g8-live
    steps:
      - uses: actions/checkout@v5

      - name: Readiness preamble
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Forge-scale live path"
            echo
            echo "Environment \`g8-live\` selected. Harness still SKIP/no-measurement"
            echo "if secrets are absent — that is **not** a fabricated PASS."
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          bash scripts/forge-scale-readiness.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: G8 smoke + scale (secrets-gated)
        shell: bash
        env:
          ARKS_G8_TOKEN: ${{ secrets.ARKS_G8_TOKEN }}
          ARKS_G8_REPO_URL: ${{ secrets.ARKS_G8_REPO_URL }}
          # Prefer explicit Environment ARKS_G8_TOKEN; do not use the job
          # GITHUB_TOKEN as a silent substitute for throwaway forge PATs.
          GITHUB_TOKEN: ""
          ARKS_G8_SCALE_OUT: ${{ github.workspace }}/verify/gates/g8-live-scale/out
          ARKS_G8_RECEIPT_OUT: ${{ github.workspace }}/verify/gates/g8/out/receipt.json
        run: |
          set -euo pipefail
          mkdir -p verify/gates/g8/out verify/gates/g8-live-scale/out
          bash verify/scripts/run-g8.sh
          bash verify/scripts/run-g8-live-scale.sh
          {
            echo
            echo "### Receipts (redacted secrets; dispositions only)"
            echo
            echo '```json'
            cat verify/gates/g8/out/receipt.json
            echo '```'
            echo
            echo '```json'
            cat verify/gates/g8-live-scale/out/receipt.json
            echo '```'
            if [[ -f verify/gates/g8-live-scale/out/samples.json ]]; then
              echo
              echo "### samples.json (durations only)"
              echo
              echo '```json'
              cat verify/gates/g8-live-scale/out/samples.json
              echo '```'
            fi
            echo
            echo "Attach under \`.spec/evidence/\` only when disposition is a real"
            echo "measurement — never invent product SLOs from SKIP receipts."
          } | tee -a "$GITHUB_STEP_SUMMARY"
