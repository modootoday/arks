[project]
name = "arks-cli"
version = "0.1.0"
description = "arks for Git — native Rust Git-compatible CLI, daemon, forge client, and self-hosted server"
readme = "../../README.md"
license = { text = "Apache-2.0 OR MIT" }
requires-python = ">=3.8"
keywords = ["git", "vcs", "cli", "concurrency", "arks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://modootoday.github.io/arks/"
Repository = "https://github.com/modootoday/arks"
Changelog = "https://github.com/modootoday/arks/blob/main/CHANGELOG.md"
Issues = "https://github.com/modootoday/arks/issues"
